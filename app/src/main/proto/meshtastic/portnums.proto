syntax = "proto3";

package meshtastic;

option java_package = "com.golfcart.gcd.data.proto";

/**
 * For any new 'apps' that run on the device or via sister apps on phones/PCs they should pick and use a
 * unique 'portnum' for their application.
 *
 * PortNums should be assigned in the following range:
 * 0-63   Core Meshtastic use, do not use for third party apps
 * 64-127 Registered 3rd party apps
 * 256-511 Use one of these portnums for your private applications
 */
enum PortNum {
  // Deprecated: do not use in new code (formerly called OPAQUE)
  UNKNOWN_APP = 0;

  // A simple UTF-8 text message
  TEXT_MESSAGE_APP = 1;

  // Reserved for built-in GPIO/example app
  REMOTE_HARDWARE_APP = 2;

  // The built-in position messaging app. Payload is a Position message.
  POSITION_APP = 3;

  // The built-in user info app. Payload is a User message.
  NODEINFO_APP = 4;

  // Protocol control packets for mesh protocol use. Payload is a Routing message.
  ROUTING_APP = 5;

  // Admin control packets. Payload is an AdminMessage message.
  ADMIN_APP = 6;

  // Compressed TEXT_MESSAGE payloads
  TEXT_MESSAGE_COMPRESSED_APP = 7;

  // Waypoint payloads. Payload is a Waypoint message.
  WAYPOINT_APP = 8;

  // Audio payloads (codec2 packets)
  AUDIO_APP = 9;

  // Same as Text Message but originating from Detection Sensor Module
  DETECTION_SENSOR_APP = 10;

  // Same as Text Message but used for critical alerts
  ALERT_APP = 11;

  // Provides a 'ping' service that replies to any packet it receives
  REPLY_APP = 32;

  // Used for the python IP tunnel feature
  IP_TUNNEL_APP = 33;

  // Paxcounter lib included in the firmware
  PAXCOUNTER_APP = 34;

  // Provides a hardware serial interface to send and receive from the Meshtastic network
  SERIAL_APP = 64;

  // Store and Forward app
  STORE_FORWARD_APP = 65;

  // Optional port for messages for the range test module
  RANGE_TEST_APP = 66;

  // Provides a format to send and receive telemetry data from the Meshtastic network
  TELEMETRY_APP = 67;

  // Experimental tools for estimating node position without a GPS
  ZPS_APP = 68;

  // Used to let multiple instances of Linux native applications communicate
  SIMULATOR_APP = 69;

  // Provides a traceroute functionality
  TRACEROUTE_APP = 70;

  // Aggregates edge info for the network by sending out a list of each node's neighbors
  NEIGHBORINFO_APP = 71;

  // ATAK Plugin
  ATAK_PLUGIN = 72;

  // Provides unencrypted information about a node for consumption by a map via MQTT
  MAP_REPORT_APP = 73;

  // PowerStress based monitoring support
  POWERSTRESS_APP = 74;

  // Private applications should use portnums >= 256
  PRIVATE_APP = 256;

  // ATAK Forwarder Module
  ATAK_FORWARDER = 257;

  // Currently we limit port nums to no higher than this value
  MAX = 511;
}
